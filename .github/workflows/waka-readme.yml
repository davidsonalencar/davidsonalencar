name: Waka Readme Stats

on:
  schedule:
    # Todo dia às 18:30 UTC (15:30 em Brasília)
    - cron: "30 18 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  update-readme:
    name: Update README with dev metrics
    runs-on: ubuntu-latest

    # O push é feito pelo PUSH_TOKEN, não pelo GITHUB_TOKEN — então o token
    # efêmero deste job não precisa de escrita nenhuma.
    permissions:
      contents: read

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # Backend de time tracking. Default = wakatime.com.
          # O plano free do WakaTime expõe apenas 14 dias via API, e esta action
          # consulta /users/current/stats/all_time — ou seja, "total code time"
          # fica capado no free.
          #
          # Por isso o backend aqui é o Wakapi (open source, retenção
          # ilimitada). Para voltar ao wakatime.com basta comentar a linha
          # abaixo. Em ambos os casos o api_url do ~/.wakatime.cfg do PyCharm
          # tem que apontar para o mesmo lugar — o plugin é o mesmo.
#          WAKATIME_API_URL: "https://wakapi.dev/api/v1/"

          # ---------------------------------------------------------------
          # Dois tokens, de propósito.
          #
          # GH_TOKEN só LÊ: lista de repos via GraphQL + dados do /user.
          # Criar em https://github.com/settings/personal-access-tokens/new
          # (fine-grained, NÃO o clássico):
          #   Repository access ...: All repositories
          #   Repository permissions: Metadata: Read, Contents: Read
          #   Account permissions .: nenhuma
          # Esse token não escreve em lugar nenhum.
          #
          # PUSH_TOKEN faz o commit do README, e precisa de ESCRITA.
          # NÃO pode ser o ${{ secrets.GITHUB_TOKEN }} — testado, dá 403.
          # A action ou não valida o token efêmero em get_repo().permissions
          # e cai de volta no GH_TOKEN (read-only), ou monta a URL como
          # https://<token>@github.com/..., com o token na posição de usuário,
          # forma que um token de instalação não autentica. Nos dois casos o
          # push termina sem permissão de escrita.
          # Segundo token fine-grained, deliberadamente estreito:
          #   Repository access ...: Only select repositories ->
          #                          davidsonalencar/davidsonalencar
          #   Repository permissions: Metadata: Read, Contents: Read and write
          # Escreve em UM repositório público, e nada além disso.
          # ---------------------------------------------------------------
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}

          # A action engole os erros de escolha de token em log de DEBUG.
          # Sem isto, uma falha de permissão aparece só como um 403 cru.
          DEBUG_LOGGING: "True"

          LOCALE: en
          SECTION_NAME: waka
          SHOW_UPDATED_DATE: "True"
          COMMIT_BY_ME: "True"

          # Sem estas duas linhas a action cai no fallback
          # Actor(USER.login, USER.email) — e USER.email vem null da API
          # porque o email da conta é privado, gerando commits assinados
          # como "davidsonalencar <None>", que não contam no gráfico de
          # contribuições.
          COMMIT_USERNAME: "Davidson Alencar"
          COMMIT_EMAIL: "davidosn.t.i@gmail.com"
          COMMIT_MESSAGE: "Update dev metrics"

          # ---------------------------------------------------------------
          # Só dependem do GH_TOKEN — funcionam desde o primeiro dia.
          # ---------------------------------------------------------------
          SHOW_COMMIT: "True"          # em que horário do dia você commita
          SHOW_DAYS_OF_WEEK: "True"    # em que dia da semana você commita
          SHOW_SHORT_INFO: "True"

          # Desligado por causa do token read-only: a API de traffic exige
          # "Administration: Read", que num token fine-grained valeria para
          # TODOS os repos selecionados. Não compensa pelo contador de views.
          SHOW_PROFILE_VIEWS: "False"

          # ---------------------------------------------------------------
          # Dependem do WakaTime/Wakapi. Ligados desde já, de propósito:
          # os números começam pequenos e vão engordando dia a dia, o que
          # é justamente o que dá para acompanhar.
          #
          # Janela de dados: a action consulta /stats/last_7_days, ou seja
          # SEMPRE os últimos 7 dias corridos (janela móvel, não semana
          # calendário). Só SHOW_TOTAL_CODE_TIME usa /stats/all_time.
          #
          # Se o WAKATIME_API_KEY ainda não estiver configurado, estes blocos
          # saem vazios (ou o job falha) — nesse caso volte tudo para False.
          # ---------------------------------------------------------------
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_TIMEZONE: "True"

          # ---------------------------------------------------------------
          # Desligados de propósito.
          # LANGUAGE_PER_REPO conta os ~40 forks antigos (Angular.js, jQuery,
          # Yii2) e distorce o perfil. Só ligar depois de arquivar os forks.
          # LINES_OF_CODE / LOC_CHART clonam TODOS os repositórios a cada run.
          # ---------------------------------------------------------------
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_LOC_CHART: "False"

  # ------------------------------------------------------------------
  # A action acima escreve SÓ no README canônico do repositório — em
  # sources/manager_github.py ela resolve o caminho como
  # REMOTE.get_readme().path, que é o README.md. Não existe input de
  # arquivo-alvo. Sem este job, README.pt-BR.md e README.es.md ficariam
  # congelados com os números do dia em que foram commitados.
  #
  # O LOCALE acima também é global por execução: uma run não consegue gerar
  # inglês no README.md e português/espanhol nas traduções. E strings como
  # "Code Time", "commits", "Last Updated on", "hrs"/"mins" e o bloco de IA
  # são hardcoded na action — ficam em inglês em QUALQUER locale. Por isso o
  # script abaixo também traduz o bloco enquanto copia.
  # ------------------------------------------------------------------
  sync-translations:
    name: Sync stats block into translated READMEs
    needs: update-readme
    runs-on: ubuntu-latest

    # Mesma lógica do job anterior: quem escreve é o PUSH_TOKEN.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Sem o ref explícito, o checkout pega o SHA que disparou o
          # workflow — ou seja, ANTES do commit que a action acabou de
          # fazer, e o script copiaria os números velhos.
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Copy and translate waka section from README.md
        run: python3 scripts/sync_readme_translations.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain README.pt-BR.md README.es.md)" ]; then
            echo "Nothing to sync."
            exit 0
          fi
          git config user.name "Davidson Alencar"
          git config user.email "davidosn.t.i@gmail.com"
          git add README.pt-BR.md README.es.md
          git commit -m "Sync dev metrics into translated READMEs"
          git push
